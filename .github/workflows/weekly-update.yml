name: Wöchentliches Brandenburg-Sprung-Update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scraper ausführen
        run: python scraper.py

      - name: Änderungen committen
        run: |
          git config user.name "brandenburg-sprung-bot"
          git config user.email "actions@users.noreply.github.com"
          shopt -s nullglob
          FILES=(data.json previous_data.json)
          EXISTING=()
          for f in "${FILES[@]}"; do
            [ -f "$f" ] && EXISTING+=("$f")
          done
          if [ ${#EXISTING[@]} -eq 0 ]; then
            echo "Keine data.json/previous_data.json vorhanden -- Scraper hat nichts geschrieben. Ueberspringe Commit."
            exit 0
          fi
          git add "${EXISTING[@]}"
          git diff --quiet --cached || git commit -m "Wöchentliches Update: $(date +'%Y-%m-%d')"
          git push
