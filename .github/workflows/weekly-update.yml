name: Wöchentliches Brandenburg-Sprung-Update

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhängigkeiten installieren
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scraper ausführen
        run: python scraper.py

      - name: Änderungen committen
        run: |
          git config user.name "brandenburg-sprung-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json previous_data.json
          git diff --quiet --cached || git commit -m "Wöchentliches Update: $(date +'%Y-%m-%d')"
          git push
